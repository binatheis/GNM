# Builds a pure-Python "core" wheel of gnm-shape (NumPy backend only, without
# the visualization/training frameworks required by the official pyproject).
#
# The workflow overlays ci/wheel/pyproject.toml onto gnm/shape/pyproject.toml,
# builds the wheel, installs it into a clean environment and runs a smoke test
# that loads the bundled v3 head model and evaluates the template mesh.
#
# The wheel is published both as a workflow artifact and attached to the
# `gnm-wheel-v3.0.0` GitHub Release (replaced on every run), from where it can
# be downloaded and dropped into a Blender extension's wheels/ folder.
#
# Trigger manually: Actions > "Build core wheel" > Run workflow (pick the ref).

name: Build core wheel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Overlay trimmed pyproject.toml
        run: cp ci/wheel/pyproject.toml gnm/shape/pyproject.toml

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel gnm/shape

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/wheel-test-venv
          /tmp/wheel-test-venv/bin/pip install --upgrade pip
          /tmp/wheel-test-venv/bin/pip install gnm/shape/dist/*.whl
          /tmp/wheel-test-venv/bin/python ci/wheel/smoke_test.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnm-shape-core-wheel
          path: gnm/shape/dist/*.whl
          retention-days: 30

      - name: Publish wheel to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create gnm-wheel-v3.0.0 \
            --title "gnm-shape core wheel (NumPy-only)" \
            --notes "Pure-Python wheel of gnm/shape built from $(git rev-parse --short HEAD). Deps: numpy, absl-py, etils[enp,epath]. Drop into a Blender extension's wheels/ folder." \
            --prerelease \
            gnm/shape/dist/*.whl \
          || gh release upload gnm-wheel-v3.0.0 gnm/shape/dist/*.whl --clobber
